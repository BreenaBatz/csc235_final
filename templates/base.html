<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dragonfire Meadery{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo2.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body id="background">

    <!-- NAVBAR -->
     <header>
    <nav class="navbar navbar-expand-lg" id="nav">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><nav class="navbar ">
  <div class="container-fluid">
    <a class="navbar-link" href="{{ url_for('home') }}">
      <img src="/static/images/logo2.jpg" alt="Dragonfire Meadery Logo" class="d-inline-block align-text-top" id="logo">
    </a>
  </div>
</nav></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
     aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('home') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('meads') }}">Meads</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('blog')}}">Blog</a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('faq')}}">FAQ</a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('find_us')}}">Find Us</a>
        </li> 
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('events')}}">Events</a>
        </li>
        <li class="nav-item">
    <a class="nav-link" href="https://shopmeads.com/dragonfire_meadery" target="_blank">
        Shop
    </a>
</li>

      </ul>
    </div>
  </div>
</nav>
  </header> 
    
<!-- MAIN CONTENT -->
<main class="main">
    {% block content %}
    {% endblock %}
</main>

<div class="email-list">
<form class="row row-cols-lg-auto g-3 align-items-center">
  <div class="col-20">
    <label class="visually-hidden" for="inlineFormInputGroupUsername">Email</label>
    <div class="input-group">
      <input type="text" class="form-control" id="inlineFormInputGroupUsername" placeholder="e.g.email@example.com">
    </div>
  </div>

  <div class="col-20">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="inlineFormCheck">
      <label class="form-check-label" for="inlineFormCheck">
        I want to subscribe to your email list!
      </label>
    </div>
  </div>

  <div class="col-20">
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>
</div>
  </div>

  <footer id="footer">
    <p class="footer-text">&copy; 2020 by Dragonfire Meadery LLC.</p>
    <p class="footer-text">580 Main Street, Coventry, CT 06238</p>
    <a href="https://www.instagram.com/dragonfiremeadery/"><img src="#" alt="Instagram"></a>
    <a href="https://www.facebook.com/Dragonfire-Meadery-576848702491013/?ref=aymt_homepage_panel&eid=ARAqnx8kQGKg5cadpaChx23UsdMF6z0UVvFKwB8t_HapSrSH1jBQQ5BQWW9RHgi9x0n2fYg11GW4dlKh"><img src="#" alt="Facebook"></a>
    <a href="https://www.youtube.com/channel/UC5nY9hkoFsuEqKV66IkwJvQ"><img src="#" alt="YouTube"></a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  
</body>
</html>
